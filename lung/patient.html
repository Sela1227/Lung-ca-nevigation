<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d9488">
<title>肺癌路徑查詢 — 彰濱秀傳癌症中心</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#0d9488; --teal2:#0f766e; --teal-d:#115e59;
  --teal-bg:rgba(13,148,136,.08); --teal-bdr:rgba(13,148,136,.22);
  --teal-soft:#e6f5f3;
  --bg:#F4F8F8; --card:#FFF; --bdr:#D8E5E4; --bdr2:#E8EFEE;
  --tx:#1e3a3a; --tx2:#5A6B6B; --tx3:#8A9595;
  --red:#dc2626; --red-bg:#FEF2F2;
  --amber:#d97706; --amber-bg:#fef3c7;
  --green:#059669;
  --self:#94703f; --self-bg:#fef9e7;

  /* layout heights — keep every page the same size */
  --hdr-h:72px;
  --bar-h:60px;
}
@media(max-width:480px){
  :root{ --hdr-h:60px; --bar-h:56px; }
}

html,body{height:100%}
body{
  font-family:'Microsoft JhengHei','微軟正黑體',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);font-size:14px;line-height:1.55;
  display:flex;flex-direction:column;
  height:100dvh;height:100vh;       /* fallback for older safari */
  overflow:hidden;
}

/* ── Header ── */
.hdr{
  flex-shrink:0;height:var(--hdr-h);
  background:linear-gradient(135deg,#115e59 0%,#0f766e 50%,#0d9488 100%);
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:relative;
}
.hdr-l{display:flex;align-items:center;gap:8px;min-width:0}
.hdr-l .home-btn{
  width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;flex-shrink:0;
}
.hdr-l .home-btn:hover{background:rgba(255,255,255,.24)}
.hdr-title{min-width:0}
.hdr-title h1{font-size:15px;font-weight:900;letter-spacing:.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title p{font-size:10.5px;opacity:.78;letter-spacing:.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:481px){
  .hdr-title h1{font-size:17px}
  .hdr-title p{font-size:11.5px}
}

/* progress dots inline in header right side */
.hdr-progress{display:flex;gap:5px;align-items:center;flex-shrink:0}
.pdot{width:18px;height:5px;border-radius:99px;background:rgba(255,255,255,.28);transition:background .2s,width .2s}
.pdot.active{background:#fff;width:22px}
.pdot.done{background:rgba(255,255,255,.65)}
@media(max-width:380px){
  .pdot{width:14px;height:4px}
  .pdot.active{width:18px}
}

/* ── Main: flex:1, fills the rest, NO scrolling for Q-pages ── */
.main{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:600px;margin:0 auto;padding:10px 12px 8px}

/* Each page fills the main area exactly */
.page{display:none;flex:1;min-height:0;flex-direction:column}
.page.active{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* The card that holds question content */
.cd{
  flex:1;min-height:0;
  background:var(--card);border:1px solid var(--bdr);border-radius:14px;
  padding:14px 14px 12px;
  box-shadow:0 2px 10px rgba(15,118,110,.05);
  display:flex;flex-direction:column;gap:10px;
  overflow:hidden;
}

/* Q-header inside card */
.cd-head{flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:1px solid var(--bdr2);padding-bottom:8px}
.cd-head-l{min-width:0;flex:1}
.cd-step{font-size:10px;font-weight:800;color:var(--teal);letter-spacing:1.5px}
.cd-q{font-size:16px;font-weight:900;color:var(--tx);letter-spacing:.5px;margin-top:1px}
.cd-sub{font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.45}
.cd-sub a{color:var(--teal);font-weight:700;text-decoration:underline;cursor:pointer}
.cd-head-r{font-size:11px;color:var(--tx3);text-align:right;flex-shrink:0;line-height:1.3}

/* ── Q1: type — 2×2 grid (mobile 1col but compact) ── */
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.type-grid .btn-type{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:14px 10px;background:var(--card);border:2px solid var(--bdr);border-radius:11px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;font-family:inherit;line-height:1.35}
.type-grid .btn-type:hover{border-color:var(--teal);background:var(--teal-soft)}
.type-grid .btn-type:active{transform:scale(.98)}
.type-grid .btn-type.selected{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 0 0 3px rgba(13,148,136,.12)}
.type-grid .btn-type .ic{width:38px;height:38px;border-radius:11px;background:var(--teal-bg);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.type-grid .btn-type.muted{border-style:dashed}
.type-grid .btn-type.muted .ic{background:#F1F4F4;color:var(--tx3)}
.type-grid .bt-t{font-size:13.5px;font-weight:800;color:var(--tx);letter-spacing:.3px}
.type-grid .bt-s{font-size:10.5px;color:var(--tx3);line-height:1.4}
.type-grid .btn-type.selected .bt-t{color:var(--teal-d)}
@media(max-width:380px){
  .type-grid{grid-template-columns:1fr}
  .type-grid .btn-type{flex-direction:row;text-align:left;padding:8px 10px;gap:9px}
  .type-grid .btn-type .ic{width:32px;height:32px}
  .type-grid .bt-info{flex:1;min-width:0}
}

/* Optional name/code field (Q1) */
.opt-fld{flex-shrink:0;background:var(--bg);border:1px dashed var(--bdr);border-radius:9px;padding:7px 10px;display:flex;gap:8px;align-items:center}
.opt-fld-lbl{font-size:10.5px;color:var(--tx3);flex-shrink:0;font-weight:600;letter-spacing:.3px}
.opt-fld input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;font-family:inherit;color:var(--tx);padding:2px 0;border-bottom:1px dotted var(--bdr2)}
.opt-fld input::placeholder{color:var(--tx3);font-size:12px}
.opt-fld input:focus{border-bottom-color:var(--teal)}

/* ── Q2: TNM ── */
.tnm-rows{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.tnm-row{background:var(--bg);border:1px solid var(--bdr2);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px}
.tnm-letter{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;font-size:14px;font-weight:900;flex-shrink:0}
.tnm-letter[data-axis="n"]{background:#0f766e}
.tnm-letter[data-axis="m"]{background:#115e59}
.tnm-meta{flex-shrink:0;width:62px}
.tnm-name{font-size:11.5px;font-weight:800;color:var(--tx);line-height:1.2}
.tnm-hint{font-size:10px;color:var(--tx3);line-height:1.3;margin-top:1px}
.tnm-btns{flex:1;display:grid;gap:5px;min-width:0}
.tnm-btns[data-cols="4"]{grid-template-columns:repeat(4,1fr)}
.tnm-btns[data-cols="2"]{grid-template-columns:repeat(2,1fr)}
.tnm-btns[data-cols="9"]{grid-template-columns:repeat(9,1fr)}
.tnm-btns[data-cols="5"]{grid-template-columns:repeat(5,1fr)}
.tnm-btn{padding:8px 4px;border:1.5px solid var(--bdr);border-radius:8px;background:var(--card);font-family:inherit;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s,background .15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:42px}
.tnm-btn:hover{border-color:var(--teal);background:var(--teal-soft)}
.tnm-btn:active{transform:scale(.95)}
.tnm-btn.selected{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.tnm-btn b{font-size:12.5px;font-weight:900;color:var(--tx);letter-spacing:.2px;line-height:1}
.tnm-btn.selected b{color:var(--teal-d)}
.tnm-btn i{font-size:9.5px;color:var(--tx3);font-style:normal;line-height:1.15;font-weight:600}
.tnm-btn.selected i{color:var(--teal2)}

/* Q2 footer: stage preview + skip-link */
.tnm-foot{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--teal-bg);border:1px dashed var(--teal-bdr);border-radius:10px;padding:7px 12px;margin-top:auto}
.tnm-foot.empty{background:transparent;border-color:var(--bdr2)}
.tnm-foot .l{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.5px}
.tnm-foot.empty .l{color:var(--tx3)}
.tnm-foot .v{font-size:18px;font-weight:900;color:var(--teal-d);letter-spacing:.5px}
.tnm-foot .v.empty{color:var(--tx3);font-size:13px}
.tnm-foot .skip{font-size:11px;color:var(--tx2);text-decoration:underline;cursor:pointer;font-weight:600}

/* ── Q3: mutation grid (3-col desktop, 2-col mobile) ── */
.mut-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;overflow:hidden}
@media(max-width:480px){
  .mut-grid{grid-template-columns:repeat(2,1fr);gap:6px}
}
.mut-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 6px;background:var(--card);border:1.5px solid var(--bdr);border-radius:10px;cursor:pointer;text-align:center;transition:transform .12s,border-color .15s,background .15s;font-family:inherit;min-height:0}
.mut-btn:hover{border-color:var(--teal);background:var(--teal-soft)}
.mut-btn:active{transform:scale(.97)}
.mut-btn.selected{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1.5px var(--teal)}
.mut-btn.muted{border-style:dashed}
.mut-tag{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--teal-bg);color:var(--teal);font-size:10px;font-weight:900;letter-spacing:.2px;line-height:1.4}
.mut-btn.pdl1 .mut-tag{background:#dbeafe;color:#1d4ed8}
.mut-btn.muted .mut-tag{background:#F1F4F4;color:var(--tx3)}
.mut-tt{font-size:12px;font-weight:800;color:var(--tx);letter-spacing:.2px;line-height:1.25}
.mut-btn.selected .mut-tt{color:var(--teal-d)}
.mut-ss{font-size:10px;color:var(--tx3);line-height:1.3;font-weight:500}

/* ── Summary ── */
.sum-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}

/* hero band: 2-col on desktop, stacked on mobile */
.sum-hero{flex-shrink:0;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff;border-radius:13px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
@media(max-width:380px){
  .sum-hero{grid-template-columns:auto 1fr auto;gap:8px;padding:9px 10px}
  .sum-hero .stage-val{font-size:24px}
}
.sum-hero .l-stage{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border-right:1px solid rgba(255,255,255,.22);padding-right:14px}
@media(max-width:380px){
  .sum-hero .l-stage{padding-right:8px}
}
.sum-hero .stage-lbl{font-size:9.5px;opacity:.85;letter-spacing:1.5px;font-weight:700}
.sum-hero .stage-val{font-size:30px;font-weight:900;letter-spacing:.5px;line-height:1}
.sum-hero .r-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.sum-hero .pw-lbl{font-size:13px;font-weight:800;line-height:1.3}
.sum-hero .meta{font-size:10.5px;opacity:.85;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qr-btn{
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);color:#fff;
  border-radius:10px;padding:7px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:1px;line-height:1.1;
  transition:background .2s,transform .12s;flex-shrink:0;
}
.qr-btn:hover{background:rgba(255,255,255,.28)}
.qr-btn:active{transform:scale(.94)}

/* QR modal */
.qr-modal{position:fixed;inset:0;background:rgba(15,30,40,.55);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px;animation:fadeIn .2s ease}
.qr-modal-box{background:#fff;border-radius:16px;padding:18px 18px 14px;max-width:300px;width:100%;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
.qr-close{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;background:var(--bg);border:none;cursor:pointer;color:var(--tx2);display:flex;align-items:center;justify-content:center}
.qr-close:hover{background:var(--bdr)}
.qr-title{font-size:14px;font-weight:900;color:var(--tx);letter-spacing:.5px;margin-bottom:10px}
.qr-canvas-wrap{padding:10px;background:var(--bg);border-radius:10px;display:flex;justify-content:center;margin-bottom:10px}
.qr-canvas-wrap canvas,.qr-canvas-wrap img{border-radius:6px;background:#fff;padding:6px}
.qr-meta{font-size:11px;color:var(--tx2);font-weight:700;line-height:1.5;margin-bottom:6px;word-break:break-all}
.qr-foot{font-size:10px;color:var(--tx3);line-height:1.5}

/* Drug list — main scrollable area */
.sum-drugs{
  flex:1;min-height:0;background:var(--card);border:1px solid var(--bdr);border-radius:13px;
  display:flex;flex-direction:column;overflow:hidden;
}
.sum-drugs-hdr{flex-shrink:0;padding:9px 12px;border-bottom:1px solid var(--bdr2);display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:900;color:var(--tx);background:var(--bg)}
.sum-drugs-hdr .ic{width:22px;height:22px;border-radius:7px;background:var(--teal-bg);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sum-drugs-hdr .ct{font-size:10.5px;font-weight:600;color:var(--tx3);margin-left:auto}
.sum-drugs-body{flex:1;min-height:0;overflow-y:auto;padding:6px 12px 10px;-webkit-overflow-scrolling:touch}
.sum-drugs-body::-webkit-scrollbar{width:6px}
.sum-drugs-body::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:99px}

/* Treatment step inside scrollable drug list */
.tx-step{padding:9px 0;border-bottom:1px dashed var(--bdr2)}
.tx-step:last-child{border-bottom:none}
.tx-step:first-child{padding-top:6px}
.tx-step-head{display:flex;gap:8px;align-items:flex-start}
.tx-step-n{width:22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-step-title{flex:1;font-size:12.5px;font-weight:800;color:var(--tx);line-height:1.45}
.tx-drugs-box{background:var(--teal-soft);border:1px solid var(--teal-bdr);border-radius:9px;padding:7px 10px;margin-top:6px;margin-left:30px}
.tx-drugs-head{font-size:10px;font-weight:800;color:var(--teal-d);letter-spacing:.8px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.tx-drug-item{padding:4px 0;border-bottom:1px dotted rgba(13,148,136,.18)}
.tx-drug-item:last-child{border-bottom:none;padding-bottom:0}
.tx-drug-item:first-child{padding-top:0}
.tx-drug-en{font-size:13px;font-weight:800;color:var(--teal-d);letter-spacing:.2px;line-height:1.35}
.tx-drug-zh{font-size:11px;color:var(--tx2);font-weight:600;line-height:1.35}
.tx-step-note{font-size:11px;color:var(--tx2);margin-top:5px;margin-left:30px;line-height:1.5;background:#fff8eb;padding:5px 8px;border-radius:6px;border-left:2.5px solid var(--amber)}
.tx-step-line{font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--teal);background:#fff;padding:1px 5px;border-radius:4px;margin-left:5px;vertical-align:1px;border:1px solid var(--teal-bdr)}
.b-nhi{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:var(--teal);color:#fff;padding:1px 5px;border-radius:4px;margin-right:4px;vertical-align:1px}
.b-self{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.5px;background:var(--self-bg);color:var(--self);padding:1px 5px;border-radius:4px;margin-right:4px;vertical-align:1px;border:1px solid #e6d3a7}

/* Bottom strip — team + warns + qr (compact, fixed height) */
.sum-strip{flex-shrink:0;display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
@media(max-width:480px){
  .sum-strip{grid-template-columns:1fr}
}
.strip-card{background:var(--card);border:1px solid var(--bdr);border-radius:11px;padding:9px 11px;display:flex;flex-direction:column;gap:5px;min-height:0;max-height:100%;overflow-y:auto}
.strip-card::-webkit-scrollbar{width:5px}
.strip-card::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:99px}
.strip-hd{font-size:11px;font-weight:900;color:var(--tx);letter-spacing:.3px;display:flex;align-items:center;gap:6px;padding-bottom:5px;border-bottom:1px solid var(--bdr2)}
.strip-hd .ic{width:18px;height:18px;border-radius:6px;background:var(--teal-bg);color:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.strip-hd.warn-hd .ic{background:var(--amber-bg);color:var(--amber)}
.strip-hd-hint{font-size:9.5px;color:var(--tx3);font-weight:600;letter-spacing:0;margin-left:auto}

/* Team rows — collapsible per dept */
.tm-dept{border-bottom:1px dashed var(--bdr2)}
.tm-dept:last-of-type{border-bottom:none}
.tm-dept-head{display:flex;justify-content:space-between;align-items:center;padding:6px 0;cursor:pointer;font-size:11px;gap:6px}
.tm-dept-head:hover{color:var(--teal-d)}
.tm-dept-head .l{color:var(--tx2);flex:1;min-width:0}
.tm-dept-head .l b{color:var(--tx);font-weight:800}
.tm-dept-head .l .h{color:var(--tx3);font-weight:600;font-size:10px;margin-left:4px}
.tm-dept-head .v{font-weight:800;color:var(--teal-d);font-size:11px}
.tm-dept-head .v.empty{color:var(--tx3);font-weight:600}
.tm-dept-head .chev{width:14px;height:14px;color:var(--tx3);transition:transform .2s;flex-shrink:0}
.tm-dept.open .tm-dept-head .chev{transform:rotate(90deg);color:var(--teal)}
.tm-doctors{display:none;flex-wrap:wrap;gap:4px;padding:4px 0 8px}
.tm-dept.open .tm-doctors{display:flex}
.tm-doc-btn{background:var(--card);border:1.5px solid var(--bdr);border-radius:6px;padding:5px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--tx);transition:all .12s}
.tm-doc-btn:hover{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-d)}
.tm-doc-btn.selected{background:var(--teal);border-color:var(--teal);color:#fff}
.tm-doc-btn.clear{border-style:dashed;color:var(--tx3);font-weight:600}
.tm-doc-btn.clear:hover{color:var(--red);border-color:var(--red);background:var(--red-bg)}

.strip-tm-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}
.strip-tm-row .l{color:var(--tx2)}
.strip-tm-row .v{font-weight:800;color:var(--tx)}
.strip-cm{margin-top:auto;padding:6px 8px;background:var(--teal-bg);border-radius:7px;display:flex;justify-content:space-between;align-items:center;font-size:11px}
.strip-cm .l{color:var(--teal-d);font-weight:700}
.strip-cm .v{color:var(--teal-d);font-weight:900}
.strip-warn{font-size:10.5px;color:#7a4f00;line-height:1.45;padding:4px 0;border-bottom:1px dotted var(--bdr2)}
.strip-warn:last-child{border-bottom:none}

/* ── Bottom action bar ── */
.actbar{
  flex-shrink:0;height:var(--bar-h);
  background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--bdr);padding:8px 14px;
  display:flex;gap:8px;align-items:stretch;
}
.act-btn{
  flex:1;border:none;border-radius:10px;padding:0 12px;font-size:13px;font-weight:800;font-family:inherit;
  cursor:pointer;transition:opacity .2s,background .2s,transform .12s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.act-btn:active{transform:scale(.98)}
.act-back{background:var(--bg);color:var(--tx2);border:1.5px solid var(--bdr);max-width:100px}
.act-back:hover{background:var(--bdr2)}
.act-next{background:var(--teal);color:#fff}
.act-next:hover{background:var(--teal2)}
.act-next:disabled{background:var(--bdr);color:var(--tx3);cursor:not-allowed}
.act-restart{background:var(--bg);color:var(--tx2);border:1.5px solid var(--bdr);max-width:120px}

/* Print: show all pages, expanded */
@media print{
  body{height:auto;overflow:visible}
  .actbar,.hdr-progress,.hdr-l .home-btn{display:none!important}
  .page{display:block!important;page-break-after:always;height:auto}
  .main{max-width:none;padding:10px 14px}
  .cd{overflow:visible}
  .sum-drugs-body{overflow:visible}
  .sum-wrap{overflow:visible}
}
</style>
</head>
<body>

<!-- ════════════════════════════════════════════ -->
<!-- Header (compact, includes inline progress)   -->
<!-- ════════════════════════════════════════════ -->
<div class="hdr">
  <div class="hdr-l">
    <a href="../" class="home-btn" title="回首頁">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 5l-7 7 7 7"/></svg>
    </a>
    <div class="hdr-title">
      <h1>肺癌治療路徑查詢</h1>
      <p>彰濱秀傳癌症中心 · 民眾簡易版</p>
    </div>
  </div>
  <div class="hdr-progress" id="progress">
    <div class="pdot active" data-p="0"></div>
    <div class="pdot" data-p="1"></div>
    <div class="pdot" data-p="2"></div>
    <div class="pdot" data-p="3"></div>
  </div>
</div>

<!-- ════════════════════════════════════════════ -->
<!-- Main: pages (each fills the area exactly)    -->
<!-- ════════════════════════════════════════════ -->
<div class="main">

<!-- ─── Q1: Type ─── -->
<div class="page active" id="p-q1">
  <div class="cd">
    <div class="cd-head">
      <div class="cd-head-l">
        <div class="cd-step">第 1 步 / 共 3-4 步</div>
        <div class="cd-q">您的肺癌類型？</div>
        <div class="cd-sub">病理報告會註明組織型態</div>
      </div>
    </div>

    <div class="type-grid" id="opt-type">
      <button type="button" class="btn-type" data-val="NSCLC_NS" onclick="pickType(this)">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9"/><path d="M5 9c0-1.7 1.3-3 3-3s4 1.5 4 4v8c-1.5 0-3-.5-4-1.5C6.5 15 5 13.5 5 9z"/><path d="M19 9c0-1.7-1.3-3-3-3s-4 1.5-4 4v8c1.5 0 3-.5 4-1.5 1.5-1.5 3-3 3-7.5z"/></svg>
        </span>
        <div class="bt-info">
          <div class="bt-t">非小細胞肺癌 — 非鱗狀</div>
          <div class="bt-s">腺癌 / 大細胞癌（最常見）</div>
        </div>
      </button>

      <button type="button" class="btn-type" data-val="NSCLC_SQ" onclick="pickType(this)">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 12 4-6h10l4 6-4 6H7z"/><path d="M9 12h6"/></svg>
        </span>
        <div class="bt-info">
          <div class="bt-t">非小細胞肺癌 — 鱗狀</div>
          <div class="bt-s">SCC，多與吸菸相關</div>
        </div>
      </button>

      <button type="button" class="btn-type" data-val="SCLC" onclick="pickType(this)">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="9" r="1.5"/><circle cx="13" cy="6" r="1.5"/><circle cx="18" cy="11" r="1.5"/><circle cx="9" cy="15" r="1.5"/><circle cx="16" cy="17" r="1.5"/><circle cx="6" cy="18" r="1.3"/></svg>
        </span>
        <div class="bt-info">
          <div class="bt-t">小細胞肺癌</div>
          <div class="bt-s">SCLC，惡性度較高</div>
        </div>
      </button>

      <button type="button" class="btn-type muted" data-val="UNKNOWN" onclick="pickType(this)">
        <span class="ic">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 1.5-1.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".5" fill="currentColor"/></svg>
        </span>
        <div class="bt-info">
          <div class="bt-t">不確定 / 還沒切片</div>
          <div class="bt-s">先繼續，僅供參考</div>
        </div>
      </button>
    </div>

    <div class="opt-fld">
      <span class="opt-fld-lbl">選填</span>
      <input id="pt-code" placeholder="病歷號" maxlength="20">
      <input id="pt-name" placeholder="姓名" maxlength="20">
    </div>
  </div>
</div>

<!-- ─── Q2: TNM ─── -->
<div class="page" id="p-q2">
  <div class="cd">
    <div class="cd-head">
      <div class="cd-head-l">
        <div class="cd-step">第 2 步 / TNM 分期</div>
        <div class="cd-q">您的 TNM 是？</div>
        <div class="cd-sub">主治醫師會告訴您 T、N、M 的數字。<a id="tnm-toggle" onclick="toggleTNMMode()">切換進階模式</a></div>
      </div>
    </div>

    <div class="tnm-rows">
      <!-- T row -->
      <div class="tnm-row">
        <div class="tnm-letter" data-axis="t">T</div>
        <div class="tnm-meta">
          <div class="tnm-name">原發腫瘤</div>
          <div class="tnm-hint">大小 / 範圍</div>
        </div>
        <div class="tnm-btns tnm-simple" data-axis="t" data-cols="4">
          <button type="button" class="tnm-btn" data-val="T1" onclick="pickTNM('t', this)"><b>T1</b><i>≤ 3 cm</i></button>
          <button type="button" class="tnm-btn" data-val="T2" onclick="pickTNM('t', this)"><b>T2</b><i>3-5 cm</i></button>
          <button type="button" class="tnm-btn" data-val="T3" onclick="pickTNM('t', this)"><b>T3</b><i>5-7 cm</i></button>
          <button type="button" class="tnm-btn" data-val="T4" onclick="pickTNM('t', this)"><b>T4</b><i>&gt; 7 cm</i></button>
        </div>
        <div class="tnm-btns tnm-adv" data-axis="t" data-cols="9" style="display:none">
          <button type="button" class="tnm-btn" data-val="Tis" onclick="pickTNM('t', this)"><b>Tis</b><i>原位</i></button>
          <button type="button" class="tnm-btn" data-val="T1mi" onclick="pickTNM('t', this)"><b>T1mi</b><i>微浸</i></button>
          <button type="button" class="tnm-btn" data-val="T1a" onclick="pickTNM('t', this)"><b>T1a</b><i>≤1cm</i></button>
          <button type="button" class="tnm-btn" data-val="T1b" onclick="pickTNM('t', this)"><b>T1b</b><i>1-2</i></button>
          <button type="button" class="tnm-btn" data-val="T1c" onclick="pickTNM('t', this)"><b>T1c</b><i>2-3</i></button>
          <button type="button" class="tnm-btn" data-val="T2a" onclick="pickTNM('t', this)"><b>T2a</b><i>3-4</i></button>

<script>
'use strict';

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
const S = { type:'', t:'', n:'', m:'', stage:'', stageCat:'', mut:'', code:'', name:'', consult:{} };
let stepIdx = 0;
let tnmAdv = false;
const PAGES = ['p-q1','p-q2','p-q3','p-sum'];

/* AJCC 9th — same as lung.html (incl. BUG-13 N2a/N2b 修正) */
function computeAJCC(t, n, m){
  if(!t || !n || !m) return '';
  if(m !== 'M0'){
    if(m === 'M1a' || m === 'M1b') return 'IVA';
    return 'IVB';
  }
  const isT1 = /^T1/.test(t), isT2 = /^T2/.test(t), isN2 = /^N2/.test(n);
  if(n === 'N0'){
    if(t === 'Tis') return '0';
    if(t === 'T1mi' || t === 'T1a') return 'IA1';
    if(t === 'T1b') return 'IA2';
    if(t === 'T1c') return 'IA3';
    if(t === 'T1') return 'IA';
    if(t === 'T2a') return 'IB';
    if(t === 'T2b') return 'IIA';
    if(t === 'T2') return 'IB';
    if(t === 'T3') return 'IIB';
    if(t === 'T4') return 'IIIA';
  }
  if(n === 'N1'){
    if(isT1 || isT2) return 'IIB';
    if(t === 'T3' || t === 'T4') return 'IIIA';
  }
  if(n === 'N2a'){ if(isT1) return 'IIB'; if(isT2 || t==='T3') return 'IIIA'; if(t==='T4') return 'IIIB'; }
  if(n === 'N2b'){ if(isT1) return 'IIIA'; if(isT2 || t==='T3') return 'IIIB'; if(t==='T4') return 'IIIB'; }
  if(isN2){
    if(isT1 || isT2) return 'IIIA';
    if(t === 'T3' || t === 'T4') return 'IIIB';
  }
  if(n === 'N3'){
    if(isT1 || isT2) return 'IIIB';
    if(t === 'T3' || t === 'T4') return 'IIIC';
  }
  return '';
}

function stageToCategory(stage){
  if(!stage) return '';
  if(/^IV/.test(stage)) return 'META';
  if(/^III/.test(stage)) return 'LOCAL';
  if(/^(0|I|II)/.test(stage)) return 'EARLY';
  return '';
}

function mutNeeded(){
  return (S.type==='NSCLC_NS' || S.type==='NSCLC_SQ') && (S.stageCat==='LOCAL' || S.stageCat==='META');
}

═══════════════════════════════════════════════════ */
function buildPath(){
  const t = S.type, st = S.stageCat, m = S.mut;
  // SCLC special
  if(t==='SCLC'){
    if(st==='META'){
      return {
        stageTxt:'SCLC 擴散期', pwTxt:'全身性化療 + 免疫治療',
        steps:[
          { title:'第一線：化療 + 免疫治療', line:DRUGS.SCLC_ES.line, nhi:'NHI', drugs: DRUGS.SCLC_ES.list, note: DRUGS.SCLC_ES.note },
          { title:'CR/PR 反應佳：可考慮預防性全腦照射 (PCI)', line:'鞏固', note:'放射治療科會診評估' },
          { title:'治療失敗或復發：二線', line:DRUGS.SCLC_2L.line, nhi:'NHI', drugs: DRUGS.SCLC_2L.list, note: DRUGS.SCLC_2L.note },
        ],
        warns:['SCLC 進展快，建議盡早展開治療','PS 3-4 因癌症導致：化療±放療；非癌症導致：以支持性療法為主'],
      };
    }
    if(st==='EARLY' || st==='LOCAL'){
      return {
        stageTxt:'SCLC 侷限期', pwTxt:'同步化放療為主',
        steps:[
          { title:'同步化放療 (CCRT) — 主要治療', line:DRUGS.SCLC_LS_CCRT.line, nhi:'NHI', drugs: DRUGS.SCLC_LS_CCRT.list, note: DRUGS.SCLC_LS_CCRT.note },
          { title:'極早期（T1-2 N0）可考慮先手術切除', line:'替代方案', note:'肺葉切除 + 淋巴結廓清' },
          { title:'治療反應佳：預防性全腦照射 (PCI)', line:'鞏固', note:'25-30 Gy' },
        ],
        warns:['年齡 ≥70 或 PS≥2：CCRT 可調整為序貫治療'],
      };
    }
    return { stageTxt:'小細胞肺癌', pwTxt:'依分期決定方向',
      steps:[{ title:'請先完成完整影像檢查（CT、腦 MRI、骨掃描）以確認分期', note:'分期確認後才能決定治療策略' }],
      warns:['SCLC 進展較快，請盡早回診確認分期'] };
  }

  // NSCLC
  const isNS = (t==='NSCLC_NS');
  const typeLabel = isNS ? '非小細胞肺癌（非鱗狀）' : (t==='NSCLC_SQ' ? '非小細胞肺癌（鱗狀）' : '肺癌');

  if(st==='EARLY'){
    return {
      stageTxt:`${typeLabel} 早期 (I-II)`, pwTxt:'手術切除為主',
      steps:[
        { title:'手術根除：肺葉切除 + 縱膈淋巴結廓清術', line:'主要治療', note:'NSCLC 早期治療首選' },
        { title:'不適合手術：立體定位放射治療 (SBRT)', line:'替代手術', note:'限 T1-2 N0；70 歲以上或心肺功能不佳者考慮' },
        { title:'術後輔助化療（若為 II 期或高風險 IB）', line:'術後輔助', nhi:'NHI', drugs:[
            {n:'Cisplatin + Vinorelbine',z:'鉑類 + 溫諾平'},
            {n:'Cisplatin + Pemetrexed（非鱗狀）',z:'鉑類 + 愛寧達'}],
          note:'4 個療程；高齡可改 Carboplatin。' },
        ...(isNS ? [{ title:'EGFR 陽性者（IB-IIIA 術後）：Osimertinib 鞏固', line:'術後鞏固', nhi:'NHI', drugs:[{n:'Osimertinib',z:'泰格莎'}], note:'術後鞏固至多 3 年（ADAURA 模式）。' }] : []),
      ],
      warns:['IB 期具高風險因子（腫瘤≥4cm、血管侵犯、臟層肋膜侵犯）建議輔助化療','年齡≥70 或 PS≥2：CCRT 可改序貫；化療劑量需調整'],
    };
  }

  if(st==='LOCAL'){
    return {
      stageTxt:`${typeLabel} 局部晚期 (III)`, pwTxt:'同步化放療為主，再加免疫鞏固',
      steps:[
        { title:'同步化放療 (CCRT) — 主要治療', line:'主要治療', nhi:'NHI', drugs:[
            {n:'Cisplatin + Etoposide + 胸部放療',z:'鉑類 + 滅必治 + RT'},
            {n:'Carboplatin + Paclitaxel + 胸部放療',z:'鉑類 + 紫杉醇 + RT'}],
          note:'每次 2 Gy，總劑量 60–66 Gy' },
        { title:'CCRT 後無惡化：Durvalumab 免疫鞏固', line:DRUGS.CONSOLIDATION.line, nhi:'NHI', drugs: DRUGS.CONSOLIDATION.list, note: DRUGS.CONSOLIDATION.note },
        { title:'部分病人可考慮先手術 + 術後輔助治療', line:'替代方案', note:'手術評估須由胸腔外科決定' },
      ],
      warns:['年齡 >70 歲或 PS >1：CCRT 可改為 Sequential（先化療後放療）','Durvalumab 鞏固限 PD-L1 ≥1%，療程至多 12 個月'],
    };
  }

  if(st==='META'){
    let steps = [];
    let warns = ['年齡 ≥70 或 PS≥2：化療劑量需調整或改 Carboplatin'];
    if(m==='EGFR'){
      steps = [
        { title:'第一線：EGFR TKI 標靶', line:DRUGS.EGFR.line, nhi:'NHI', drugs: DRUGS.EGFR.list, note: DRUGS.EGFR.note },
        { title:'EGFR L858R + 腦轉移：合併方案', line:DRUGS.EGFR_BRAIN.line, nhi:'NHI', drugs: DRUGS.EGFR_BRAIN.list, note: DRUGS.EGFR_BRAIN.note },
        { title:'惡化後：T790M 檢測 → Osimertinib 二線', line:'二線', note:'若一線非 Osimertinib，惡化後可換用' },
        { title:'多線失敗：含鉑化療', line:'後線', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin/Cisplatin',z:'愛寧達 + 鉑類'}], note:'非鱗狀標準後線' },
      ];
    } else if(m==='ALK'){
      steps = [
        { title:'第一線：ALK TKI 標靶', line:DRUGS.ALK.line, nhi:'NHI', drugs: DRUGS.ALK.list, note: DRUGS.ALK.note },
        { title:'耐藥後：依抗藥機制換次線 ALK TKI', line:'二線', note:'Lorlatinib 可用於 alectinib/ceritinib/brigatinib 失敗後' },
        { title:'多線失敗：含鉑化療', line:'後線', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin',z:'愛寧達 + 鉑類'}], note:'非鱗狀後線標準' },
      ];
    } else if(m==='ROS1'){
      steps = [
        { title:'第一線：ROS1 TKI 標靶', line:DRUGS.ROS1.line, nhi:'NHI', drugs: DRUGS.ROS1.list, note: DRUGS.ROS1.note },
        { title:'耐藥或多線失敗：含鉑化療', line:'後線', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin',z:'愛寧達 + 鉑類'}], note:'' },
      ];
    } else if(m==='BRAF'){
      steps = [
        { title:'第一線：含鉑化療', line:'一線', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin（非鱗狀）',z:'愛寧達 + 鉑類'}], note:'鱗狀者 Paclitaxel + Carboplatin' },
        { title:'第二線（含鉑後）：BRAF + MEK 標靶', line:DRUGS.BRAF.line, nhi:'NHI', drugs: DRUGS.BRAF.list, note: DRUGS.BRAF.note },
      ];
    } else if(m==='MET'){
      steps = [
        { title:'標靶：MET 抑制劑', line:DRUGS.MET.line, nhi:'NHI', drugs: DRUGS.MET.list, note: DRUGS.MET.note },
        { title:'若無法使用標靶：含鉑化療 ± 免疫', line:'替代', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin ± Pembrolizumab',z:'愛寧達 + 鉑類 ± 吉舒達'}], note:'' },
      ];
    } else if(m==='KRAS'){
      steps = [
        { title:'第一線：含鉑化療 + 免疫', line:'一線', nhi:'NHI', drugs:[{n:'Pemetrexed + Carboplatin + Pembrolizumab',z:'愛寧達 + 鉑類 + 吉舒達'}], note:'依 PD-L1 表現考慮 IO' },
        { title:'第二線：KRAS G12C 標靶', line:DRUGS.KRAS.line, nhi:'SELF', drugs: DRUGS.KRAS.list, note: DRUGS.KRAS.note },
      ];
      warns.push('KRAS G12C 標靶 Sotorasib 健保尚未給付，需自費');
    } else if(m==='PDL1_HIGH'){
      const k = isNS ? 'NS_PDL1H' : 'SQ_PDL1H';
      steps = [
        { title:'第一線：免疫 + 化療', line:DRUGS[k].line, nhi:'NHI', drugs: DRUGS[k].list, note: DRUGS[k].note },
        { title:'惡化後：含鉑後線 / 加做 NGS 找其他突變', line:'後線', note:'' },
      ];
    } else if(m==='PDL1_LOW'){
      const k = isNS ? 'NS_PDL1L' : 'SQ_PDL1L';
      steps = [
        { title:'第一線：化療 ± 免疫', line:DRUGS[k].line, nhi:'NHI', drugs: DRUGS[k].list, note: DRUGS[k].note },
        { title:'惡化後：後線化療或加做 NGS', line:'後線', note:'進一步分子檢測（如 KRAS、HER2、NTRK）' },
      ];
      warns.push('PS 2：以單獨化療為主');
      warns.push('PS 3-4：以支持性療法為主');
    } else {
      // NONE
      steps = [
        { title:'建議盡快完成完整基因檢測', line:'前置檢查', note:'EGFR / ALK / ROS1 / BRAF / MET / KRAS / NTRK + PD-L1' },
        { title:'等報告期間：可先用化療', line:'一線', nhi:'NHI', drugs: isNS ? [{n:'Pemetrexed + Carboplatin/Cisplatin',z:'愛寧達 + 鉑類'}] : [{n:'Carboplatin + Paclitaxel',z:'鉑類 + 紫杉醇'}], note:'' },
        { title:'依檢測結果再個人化治療', line:'後續', note:'有突變→標靶；無突變且 PD-L1 高→免疫加化療' },
      ];
      warns.push('基因檢測會大幅影響可用藥物，請務必完成');
    }
    return { stageTxt:`${typeLabel} 轉移期 (IV)`, pwTxt:'依基因 / PD-L1 個人化治療', steps, warns };
  }

  return { stageTxt: typeLabel + '（分期待定）', pwTxt:'請先完成完整分期檢查',
    steps:[{ title:'請與主治醫師討論完整分期計畫（CT、PET、腦 MRI）', note:'分期確認後才能個人化治療' }],
    warns:['未明確分期前的建議僅供參考'] };
}

/* ═══════════════════════════════════════════════════

═══════════════════════════════════════════════════ */
function renderTreatmentSteps(steps){
  if(!steps || !steps.length) return '<p style="font-size:11px;color:var(--tx3);padding:10px 0">尚無資料</p>';
  return steps.map((s,i)=>{
    let badge = '';
    if(s.nhi==='NHI') badge = '<span class="b-nhi">健保</span>';
    else if(s.nhi==='SELF') badge = '<span class="b-self">自費</span>';
    let line = s.line ? `<span class="tx-step-line">${escapeHtml(s.line)}</span>` : '';
    let drugsBox = '';
    if(s.drugs && s.drugs.length){
      const items = s.drugs.map(d=>{
        const en = `<div class="tx-drug-en">${escapeHtml(d.n)}</div>`;
        const zh = d.z ? `<div class="tx-drug-zh">${escapeHtml(d.z)}</div>` : '';
        return `<div class="tx-drug-item">${en}${zh}</div>`;
      }).join('');
      drugsBox = `<div class="tx-drugs-box">
        <div class="tx-drugs-head">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a4 4 0 0 1 5.66-5.66l-7.34 7.34a4 4 0 1 1-5.66-5.66"/><path d="m14 7 6 6"/></svg>
          適用藥物
        </div>${items}</div>`;
    }
    let note = s.note ? `<div class="tx-step-note">${escapeHtml(s.note)}</div>` : '';
    return `<div class="tx-step">
      <div class="tx-step-head">
        <div class="tx-step-n">${i+1}</div>
        <div class="tx-step-title">${badge}${escapeHtml(s.title)}${line}</div>
      </div>
      ${drugsBox}${note}
    </div>`;
  }).join('');
}

function renderSummary(){
  const r = buildPath();
  document.getElementById('sum-stage').textContent = stageDisplay();
  document.getElementById('sum-pw').textContent = r.pwTxt;
  // meta line
  let meta = r.stageTxt;
  const tnmStr = [S.t, S.n, S.m].filter(Boolean).join(' ');
  if(tnmStr) meta += ' · ' + tnmStr;
  if(S.mut && S.mut!=='NONE') meta += ' · ' + mutDisplay(S.mut);
  if(S.code) meta += ' · ' + S.code;
  if(S.name) meta += ' ' + S.name;
  document.getElementById('sum-meta').textContent = meta;

  document.getElementById('sum-tx').innerHTML = renderTreatmentSteps(r.steps);
  document.getElementById('sum-tx-ct').textContent = `${(r.steps||[]).length} 個步驟`;

  // warns
  const warnEl = document.getElementById('sum-warn');
  if(!r.warns || !r.warns.length){
    warnEl.innerHTML = '<div style="font-size:10.5px;color:var(--tx3);padding:4px 0">無特別事項</div>';
  } else {
    warnEl.innerHTML = r.warns.map(w=>`<div class="strip-warn">${escapeHtml(w)}</div>`).join('');
  }

  // team + case manager
  renderTeam();
  document.getElementById('cm-name').textContent = TEAM.caseManager.name;
}

        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="tm-doctors">${docBtns}${clearBtn}</div>
    </div>`;
  }).join('');
  el.innerHTML = html;
}

function toggleDept(id){
  const el = document.querySelector(`.tm-dept[data-id="${id}"]`);
  if(el) el.classList.toggle('open');
}
function pickDoctor(deptId, name){
  if(name) S.consult[deptId] = name;
  else delete S.consult[deptId];
  renderTeam();
  // 收合該科展開區（讓使用者看到結果，不浪費版面）
  if(name){
    setTimeout(()=>{
      const el = document.querySelector(`.tm-dept[data-id="${deptId}"]`);
      if(el) el.classList.remove('open');
    }, 200);
  }
}

/* ─── QR (always-on, modal triggered) ─── */
function buildQRPayload(){
  const r = buildPath();
  const tnmStr = [S.t, S.n, S.m].filter(Boolean).join(' ');
  const parts = ['肺癌路徑'];
  if(S.code) parts.push(S.code);
  if(S.name) parts.push(S.name);
  parts.push('Stage ' + stageDisplay());
  if(tnmStr) parts.push(tnmStr);
  if(S.mut && S.mut!=='NONE') parts.push(mutDisplay(S.mut));
  parts.push(r.pwTxt);
  // Doctors
  const doctors = TEAM.depts
    .filter(d=>S.consult[d.id])
    .map(d=>`${d.name}:${S.consult[d.id]}`);
  if(doctors.length) parts.push(...doctors);
  return parts.join(' | ');
}
function openQR(){
  const modal = document.getElementById('qr-modal');
  modal.style.display = 'flex';
  const canvas = document.getElementById('qr-canvas');
  canvas.innerHTML = '';
  const payload = buildQRPayload();
  document.getElementById('qr-meta').textContent = payload;
  try{
    new QRCode(canvas, { text: payload, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  } catch(e){
    canvas.textContent = 'QR 產生失敗';
  }
}
function closeQR(){ document.getElementById('qr-modal').style.display='none'; }
function closeQRBackdrop(ev){
  if(ev.target.id === 'qr-modal') closeQR();
}

function stageDisplay(){
  if(S.stage) return S.stage;
  if(S.stageCat==='EARLY') return 'I-II';
  if(S.stageCat==='LOCAL') return 'III';
  if(S.stageCat==='META')  return 'IV';
  return '?';
}
function mutDisplay(m){
  return ({EGFR:'EGFR(+)',ALK:'ALK(+)',ROS1:'ROS1(+)',BRAF:'BRAF(+)',MET:'MET(+)',KRAS:'KRAS G12C(+)',PDL1_HIGH:'PD-L1≥50%',PDL1_LOW:'PD-L1<50%',NONE:''}[m] || '');
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ═══════════════════════════════════════════════════
   Navigation flow
═══════════════════════════════════════════════════ */
function showPage(idx){
  let pageId = PAGES[idx];
  if(idx===2 && !mutNeeded()){
    pageId = 'p-sum';
    stepIdx = 3;
  }
  PAGES.forEach(id => document.getElementById(id).classList.toggle('active', id===pageId));
  // progress dots
  const totalSteps = mutNeeded() ? 4 : 3;
  document.querySelectorAll('.pdot').forEach((d,i)=>{
    const visible = i < totalSteps;
    d.style.display = visible ? '' : 'none';
    d.classList.remove('active','done');
    if(visible){
      if(i < stepIdx) d.classList.add('done');
      else if(i === stepIdx) d.classList.add('active');
    }
  });
  updateActBar();
  if(pageId==='p-sum') renderSummary();
}

function updateActBar(){
  const back = document.getElementById('bt-back');
  const next = document.getElementById('bt-next');
  const restart = document.getElementById('bt-restart');

  // Summary page: show restart only
  if(stepIdx >= 3){
    back.style.display='';
    next.style.display='none';
    restart.style.display='';
    return;
  }
  back.style.display = (stepIdx>0) ? '' : 'none';
  next.style.display = '';
  restart.style.display = 'none';

  let canNext = false;
  if(stepIdx===0) canNext = !!S.type;
  else if(stepIdx===1) canNext = !!S.stageCat;
  else if(stepIdx===2) canNext = !!S.mut;
  next.disabled = !canNext;

  const isLast = (stepIdx===2) || (stepIdx===1 && !mutNeeded() && S.stageCat);
  next.innerHTML = isLast
    ? '看治療路徑 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>'
    : '下一題 <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>';
}

/* ═══════════════════════════════════════════════════
   Pickers
═══════════════════════════════════════════════════ */
function pickType(btn){
  S.type = btn.dataset.val;
  document.querySelectorAll('#opt-type .btn-type').forEach(b=>b.classList.toggle('selected', b===btn));
  updateActBar();
}

function pickMut(btn){
  S.mut = btn.dataset.val;
  document.querySelectorAll('#opt-mut .mut-btn').forEach(b=>b.classList.toggle('selected', b===btn));
  setTimeout(()=>goNext(), 200);
}

function pickTNM(axis, btn){
  const val = btn.dataset.val;
  S[axis] = val;
  document.querySelectorAll(`[data-axis="${axis}"] .tnm-btn`).forEach(b=>{
    b.classList.toggle('selected', b.dataset.val===val);
  });
  recomputeStage();
}

function recomputeStage(){
  const stage = computeAJCC(S.t, S.n, S.m);
  S.stage = stage;
  S.stageCat = stageToCategory(stage);
  const foot = document.getElementById('tnm-foot');
  const val = document.getElementById('tnm-stage');
  if(stage){
    foot.classList.remove('empty');
    val.classList.remove('empty');
    val.textContent = 'Stage ' + stage;
  } else {
    foot.classList.add('empty');
    val.classList.add('empty');
    val.textContent = '— 請完整選擇 T、N、M —';
  }
  updateActBar();
}

function toggleTNMMode(){
  tnmAdv = !tnmAdv;
  document.querySelectorAll('.tnm-simple').forEach(el=>el.style.display = tnmAdv ? 'none' : '');
  document.querySelectorAll('.tnm-adv').forEach(el=>el.style.display = tnmAdv ? '' : 'none');
  document.getElementById('tnm-toggle').textContent = tnmAdv ? '切換簡化模式' : '切換進階模式';
  // Re-apply highlights
  ['t','n','m'].forEach(axis=>{
    const v = S[axis];
    document.querySelectorAll(`[data-axis="${axis}"] .tnm-btn`).forEach(b=>{
      b.classList.toggle('selected', b.dataset.val===v);
    });
  });
}

function setStageUnknown(){
  S.t=''; S.n=''; S.m=''; S.stage=''; S.stageCat='EARLY';
  document.querySelectorAll('.tnm-btn').forEach(b=>b.classList.remove('selected'));
  recomputeStage();
  // After clearing, stageCat is set, so update actbar manually
  S.stageCat='EARLY'; // recomputeStage cleared it
  document.getElementById('tnm-foot').classList.remove('empty');
  document.getElementById('tnm-stage').classList.remove('empty');
  document.getElementById('tnm-stage').textContent = '不確定 — 一般原則';
  updateActBar();
  setTimeout(()=>goNext(), 250);
}

function goNext(){
  if(stepIdx===0){
    S.code = (document.getElementById('pt-code').value||'').trim();
    S.name = (document.getElementById('pt-name').value||'').trim();
  }
  if(stepIdx===1 && !mutNeeded()){
    stepIdx = 3; showPage(3); return;
  }
  if(stepIdx<3){ stepIdx++; showPage(stepIdx); }
}

function goPrev(){
  if(stepIdx<=0) return;
  if(stepIdx===3 && !mutNeeded()){ stepIdx = 1; showPage(1); return; }
  stepIdx--; showPage(stepIdx);
}

function restart(){
  S.type=''; S.t=''; S.n=''; S.m=''; S.stage=''; S.stageCat=''; S.mut=''; S.code=''; S.name=''; S.consult={};
  stepIdx=0; tnmAdv=false;
  document.querySelectorAll('.btn-type, .tnm-btn, .mut-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.tnm-simple').forEach(el=>el.style.display='');
  document.querySelectorAll('.tnm-adv').forEach(el=>el.style.display='none');
  document.getElementById('tnm-toggle').textContent = '切換進階模式';
  document.getElementById('pt-code').value=''; document.getElementById('pt-name').value='';
  recomputeStage();
  showPage(0);
}

// init
showPage(0);
</script>
</body>
</html>
