<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>彰濱秀傳癌症中心 — 癌症臨床路徑</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#5B8FB9;--primary-hover:#4A7A9E;--primary-light:rgba(91,143,185,0.10);
  --sidebar-bg:#37516b;
  --bg:#F7F9FB;--bg-card:#FFFFFF;--bg-hover:#F1F4F8;
  --border:#E2E8F0;--border-light:#EDF1F5;
  --text:#2C3E50;--text-secondary:#5A6B7C;--text-hint:#8A9BAA;
  --radius:16px;--teal:#0d9488;--teal-light:rgba(13,148,136,0.08);
}
body{font-family:'Microsoft JhengHei','微軟正黑體',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
.header{background:linear-gradient(135deg,#37516b 0%,#4A7A9E 55%,#5B8FB9 100%);color:#fff;padding:48px 24px 64px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 15% 85%,rgba(255,255,255,.06) 0%,transparent 50%),radial-gradient(circle at 85% 15%,rgba(255,255,255,.04) 0%,transparent 40%)}
.header-inner{position:relative;z-index:1;max-width:800px;margin:0 auto}
.logo-row{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:6px}
.logo-icon{width:56px;height:56px;background:rgba(255,255,255,.12);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.hospital-name{font-size:26px;font-weight:900;letter-spacing:1.5px;text-shadow:0 2px 8px rgba(0,0,0,.12)}
.subtitle{font-size:12px;opacity:.78;font-weight:400;margin-top:4px;letter-spacing:1.5px}

/* ── Main ── */
.main{flex:1;max-width:960px;width:100%;margin:-36px auto 0;padding:0 20px 48px;position:relative;z-index:2}

/* ── Role selector ── */
.role-section{margin-bottom:28px}
.role-label{font-size:13px;font-weight:700;color:var(--text-hint);letter-spacing:1px;margin-bottom:14px;text-align:center}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.role-card{
  background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius);
  padding:28px 20px;cursor:pointer;text-align:center;position:relative;
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.role-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(91,143,185,.10)}
.role-card.active-pro{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.role-card.active-pat{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-light)}
.role-icon{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:28px;transition:transform .22s}
.role-card:hover .role-icon{transform:scale(1.06)}
.role-icon.pro{background:var(--primary-light);color:var(--primary)}
.role-icon.pat{background:var(--teal-light);color:var(--teal)}
.role-title{font-size:18px;font-weight:800;margin-bottom:4px;letter-spacing:.3px}
.role-sub{font-size:12px;color:var(--text-hint);line-height:1.6}
.role-arrow{display:none;position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:var(--bg-card);border-right:2px solid var(--border);border-bottom:2px solid var(--border);transform:translateX(-50%) rotate(45deg)}

/* ── Cancer grid ── */
.section-panel{display:none;animation:fadeSlide .35s ease}
.section-panel.show{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:14px;font-weight:700;color:var(--text-secondary);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-pro{background:var(--primary)}
.dot-pat{background:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* ── Cards ── */
.card{
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);
  padding:24px 18px 20px;text-align:center;position:relative;overflow:hidden;
  transition:transform .22s,box-shadow .22s,border-color .22s;
}
.card.active{cursor:pointer}
.card.active:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(91,143,185,.12);border-color:var(--primary)}
.card.active.pat-card:hover{border-color:var(--teal)}
.card.wip{opacity:.45;cursor:default}
.card-icon{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .22s}
.card.active:hover .card-icon{transform:scale(1.06)}
.icon-pro{background:var(--primary-light);color:var(--primary)}
.icon-pat{background:var(--teal-light);color:var(--teal)}
.card-title{font-size:16px;font-weight:800;margin-bottom:3px;letter-spacing:.3px}
.card-sub{font-size:11px;color:var(--text-hint);line-height:1.5}
.card-badge{display:inline-flex;align-items:center;gap:4px;margin-top:12px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.3px}
.badge-ready{background:var(--primary-light);color:var(--primary);border:1px solid rgba(91,143,185,.25)}
.badge-ready-pat{background:var(--teal-light);color:var(--teal);border:1px solid rgba(13,148,136,.25)}
.badge-wip{background:var(--bg-hover);color:var(--text-hint);border:1px solid var(--border-light)}

/* ── Footer ── */
.footer{text-align:center;padding:24px 20px;font-size:12px;color:var(--text-hint);border-top:1px solid var(--border-light);background:var(--bg-card);line-height:1.9}
.footer strong{color:var(--text-secondary);font-weight:600}

/* ── Responsive ── */
@media(max-width:640px){
  .header{padding:32px 16px 48px}
  .hospital-name{font-size:21px}
  .logo-icon{width:44px;height:44px;font-size:22px;border-radius:14px}
  .main{margin-top:-24px;padding:0 12px 32px}
  .role-grid{gap:10px}
  .role-card{padding:20px 14px}
  .role-icon{width:52px;height:52px;font-size:24px;margin-bottom:10px}
  .role-title{font-size:16px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:20px 12px 16px}
  .card-icon{width:48px;height:48px;font-size:20px;margin-bottom:10px}
  .card-title{font-size:14px}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo-row">
      <div class="logo-icon"><i class="fa-solid fa-hospital"></i></div>
      <div>
        <div class="hospital-name">彰濱秀傳癌症中心</div>
        <div class="subtitle">CANCER NAVIGATION SYSTEM</div>
      </div>
    </div>
  </div>
</div>

<div class="main">
  <!-- Role selector -->
  <div class="role-section">
    <div class="role-label">請選擇使用身份</div>
    <div class="role-grid">
      <div class="role-card" id="role-pro" onclick="selectRole('pro')">
        <div class="role-icon pro"><i class="fa-solid fa-user-doctor"></i></div>
        <div class="role-title">醫護專業版</div>
        <div class="role-sub">完整臨床路徑導航<br>分期、治療決策、執行追蹤</div>
      </div>
      <div class="role-card" id="role-pat" onclick="selectRole('pat')">
        <div class="role-icon pat"><i class="fa-solid fa-user"></i></div>
        <div class="role-title">民眾簡易版</div>
        <div class="role-sub">瞭解我的治療計畫<br>簡單易懂的照護指引</div>
      </div>
    </div>
  </div>

  <!-- Professional cancer grid -->
  <div class="section-panel" id="panel-pro">
    <div class="section-title"><span class="dot dot-pro"></span> 選擇癌別 — 醫護專業版</div>
    <div class="grid" id="grid-pro"></div>
  </div>

  <!-- Patient cancer grid -->
  <div class="section-panel" id="panel-pat">
    <div class="section-title"><span class="dot dot-pat"></span> 選擇癌別 — 民眾簡易版</div>
    <div class="grid" id="grid-pat"></div>
  </div>
</div>

<div class="footer">
  <strong>彰濱秀傳紀念醫院 癌症中心</strong><br>
  Cancer Navigation V2.8.2 &nbsp;·&nbsp; 僅供院內臨床人員使用
</div>

<script>
const CANCERS = [
  {id:'lung',  name:'肺癌',     icon:'fa-solid fa-lungs',         proUrl:'lung/',         patUrl:'lung/patient.html', active:true},
  {id:'breast',name:'乳癌',     icon:'fa-solid fa-ribbon',        proUrl:'breast/',       patUrl:'breast/patient.html'},
  {id:'crc',   name:'大腸直腸癌',icon:'fa-solid fa-bacteria',     proUrl:'crc/',          patUrl:'crc/patient.html'},
  {id:'esoph', name:'食道癌',    icon:'fa-solid fa-utensils',      proUrl:'esoph/',        patUrl:'esoph/patient.html'},
  {id:'hn',    name:'頭頸癌',    icon:'fa-solid fa-head-side-mask',proUrl:'hn/',           patUrl:'hn/patient.html'},
  {id:'liver', name:'肝癌',      icon:'fa-solid fa-shield-virus',  proUrl:'liver/',        patUrl:'liver/patient.html'},
  {id:'prost', name:'攝護腺癌',  icon:'fa-solid fa-mars',          proUrl:'prost/',        patUrl:'prost/patient.html'},
  {id:'bladder',name:'膀胱癌',   icon:'fa-solid fa-droplet',       proUrl:'bladder/',      patUrl:'bladder/patient.html'},
];

function buildGrid(gridId, mode){
  const grid = document.getElementById(gridId);
  grid.innerHTML = '';
  const isPat = mode === 'pat';
  CANCERS.forEach(c => {
    const isActive = c.active;
    const card = document.createElement('div');
    card.className = `card ${isActive?'active':'wip'}${isPat?' pat-card':''}`;
    if(isActive) card.onclick = () => location.href = isPat ? c.patUrl : c.proUrl;
    card.innerHTML = `
      <div class="card-icon ${isPat?'icon-pat':'icon-pro'}"><i class="${c.icon}"></i></div>
      <div class="card-title">${c.name}</div>
      <div class="card-sub">${isActive?(isPat?'我的治療計畫':'臨床路徑導航'):'即將上線'}</div>
      <div class="card-badge ${isActive?(isPat?'badge-ready-pat':'badge-ready'):'badge-wip'}">
        <i class="fa-solid ${isActive?'fa-circle-check':'fa-hammer'}" style="font-size:9px"></i>
        ${isActive?'可使用':'建構中'}
      </div>
    `;
    grid.appendChild(card);
  });
}

buildGrid('grid-pro', 'pro');
buildGrid('grid-pat', 'pat');

let currentRole = null;
function selectRole(role){
  currentRole = role;
  document.getElementById('role-pro').className = `role-card${role==='pro'?' active-pro':''}`;
  document.getElementById('role-pat').className = `role-card${role==='pat'?' active-pat':''}`;
  document.getElementById('panel-pro').className = `section-panel${role==='pro'?' show':''}`;
  document.getElementById('panel-pat').className = `section-panel${role==='pat'?' show':''}`;
}
</script>
</body>
</html>
